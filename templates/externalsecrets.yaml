{{- range $name, $es := .Values.externalSecrets }}
{{- if kindIs "invalid" $es }}{{ continue }}{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  {{- include "redb.metadata" (dict "root" $ "name" $name "item" $es "wave" -1) | nindent 2 }}
spec:
  {{- include "redb.externalSecretSpec" (dict "root" $ "spec" $es.spec) | nindent 2 }}
{{- end }}
